[project]
name = "lineview"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.2",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
lineview = "lineview.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]
